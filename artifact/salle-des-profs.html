const ico = (n, s = 20, fill = false) =>
  `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="${fill ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

// ---------- Utilitaires ----------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const initials = n => String(n || '?').trim().split(/\s+/).map(p => p[0]).join('').slice(0, 2).toUpperCase();
const first = n => String(n || '').trim().split(/\s+/)[0] || 'Cette personne';
const safeUrl = u => /^https?:\/\/\S+$/i.test(u || '') ? u : '';
const hash = s => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
const grad = id => { const [a, b] = GRADS[hash(id) % GRADS.length]; return `linear-gradient(135deg, ${a}, ${b})`; };
const okPhoto = p => typeof p === 'string' && p.length < 260000 && /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(p);
const avatar = (id, nom, photo) => okPhoto(photo)
  ? `<div class="avatar" style="background:${grad(id)}"><img src="${photo}" alt=""></div>`
  : `<div class="avatar" style="background:${grad(id)}">${esc(initials(nom))}</div>`;
const daysAgo = t => t ? Math.floor((Date.now() - t) / 864e5) : null;
const uidShort = () => Math.random().toString(36).slice(2, 10);
const options = (obj, sel) => Object.entries(obj).map(([k, v]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${esc(v)}</option>`).join('');

function toast(msg) {
  const t = $('Toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200);
}
function writeError(err) {
  const code = err && err.code;
  if (code === 'invalid_argument') toast("Tu n'as pas le droit de modifier ces données. Demande à l'équipe d'insertion l'accès Contributeur.");
  else if (code === 'quota_exceeded') toast("L'espace de stockage est plein. L'équipe d'insertion doit supprimer d'anciennes fiches.");
  else toast("L'enregistrement a échoué. Vérifie ta connexion et réessaie.");
  console.warn(err);
}

// ---------- État ----------
// Pour l'instant, seule la vue « nouveau prof » est offerte. Mettre à false pour rouvrir les vues IP et mentor.
const SEULEMENT_NOUVEAU = true;
let db = null, user = null;
const S = {
  phase: 'loading', uid: null, isIP: false, loaded: new Set(),
  ecoles: [], membres: {}, ressources: {}, demandes: {}, reponses: {}, etat: { passes: [], gardees: [] },
  view: SEULEMENT_NOUVEAU ? 'nouveau' : null, tab: null, overlay: null, filter: 'all', scope: 'ecole', resFilter: 'all', suiviEcole: null,
  history: [], dragging: false, pending: false, readonly: false, localVers: {},
};
// Profil fictif pour qui n'a que l'accès en lecture : on parcourt sans rien enregistrer.
const VISITEUR = { role: 'nouveau', nom: '', ecoleId: null, matiere: null, niveau: null };

// Une écriture à la fois par document, toujours avec l'état complet le plus récent.
const queues = {};
function write(path, data) {
  if (S.readonly) return Promise.resolve();
  queues[path] = (queues[path] || Promise.resolve()).then(() => db.doc(path).set(data)).catch(writeError);
  return queues[path];
}
function remove(path) {
  if (S.readonly) return Promise.resolve();
  queues[path] = (queues[path] || Promise.resolve()).then(() => db.doc(path).delete()).catch(writeError);
  return queues[path];
}

// ---------- Données dérivées ----------
const me = () => S.membres[S.uid] || (S.readonly ? VISITEUR : undefined);
const view = () => S.view || (S.isIP ? 'ip' : me()?.role || null);
const ecoleNom = id => S.ecoles.find(e => e.id === id)?.nom || 'École non précisée';
const mentors = () => Object.entries(S.membres).filter(([, m]) => m.role === 'mentor').map(([uid, m]) => ({ uid, ...m }));
const nouveaux = () => Object.entries(S.membres).filter(([, m]) => m.role === 'nouveau').map(([uid, m]) => ({ uid, ...m }));
function allResources() {
  return Object.entries(S.ressources).flatMap(([auteur, items]) =>
    (items || []).map(it => ({ ...it, auteur, key: `r:${auteur}:${it.id}`, kind: 'res' })))
    .sort((a, b) => (b.creeLe || 0) - (a.creeLe || 0));
}
// Statut d'une demande : réponse explicite du mentor, sinon acceptation automatique, sinon en attente.
function statut(from, mentor) {
  const d = S.demandes[from]?.[mentor];
  if (!d) return null;
  const r = S.reponses[mentor]?.[from];
  if (r) return r;
  return S.membres[mentor]?.autoAccept ? 'accepte' : 'attente';
}
function demandesRecues(mentor) {
  return Object.entries(S.demandes).filter(([, v]) => v && v[mentor])
    .map(([from, v]) => ({ from, ...v[mentor], statut: statut(from, mentor), membre: S.membres[from] }))
    .filter(d => d.membre)
    .sort((a, b) => (b.le || 0) - (a.le || 0));
}
function mentoratsActifs(mentor) {
  return demandesRecues(mentor).filter(d => d.type === 'mentorat' && d.statut === 'accepte').length;
}

// ---------- Démarrage ----------
async function boot() {
  render();
  if (!window.claude || !window.claude.use) { S.phase = 'offline'; return render(); }
  [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  if (!db) { S.phase = 'offline'; return render(); }
  if (user) {
    const [id, ip, canWrite] = await Promise.all([user.id(), user.canEdit(), user.can('data.write')]);
    S.uid = id; S.isIP = ip;
    S.readonly = !id || canWrite === false;
  } else S.readonly = true;
  if (S.readonly) { S.uid = S.uid || 'visiteur'; S.scope = 'all'; S.isIP = false; }
  const need = S.readonly ? 5 : 6;
  const done = k => { S.loaded.add(k); if (S.loaded.size >= need && S.phase === 'loading') S.phase = 'ready'; render(); };
  const fail = e => console.warn(e);
  db.collection('ecoles').onSnapshot(s => {
    S.ecoles = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => String(a.nom).localeCompare(String(b.nom), 'fr'));
    done('ecoles');
  }, fail);
  db.collection('membres').onSnapshot(s => { S.membres = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); done('membres'); }, fail);
  db.collection('ressources').onSnapshot(s => { S.ressources = Object.fromEntries(s.docs.map(d => [d.id, d.data().items || []])); done('ressources'); }, fail);
  db.collection('demandes').onSnapshot(s => {
    S.demandes = Object.fromEntries(s.docs.map(d => [d.id, d.data().vers || {}]));
    if (S.readonly) S.demandes[S.uid] = S.localVers;
    done('demandes');
  }, fail);
  db.collection('reponses').onSnapshot(s => { S.reponses = Object.fromEntries(s.docs.map(d => [d.id, d.data().de || {}])); done('reponses'); }, fail);
  if (!S.readonly) db.doc(`data/users/${S.uid}/etat`).onSnapshot(d => {
    const v = d.exists ? d.data() : {};
    S.etat = { passes: [...(v.passes || [])], gardees: [...(v.gardees || [])] };
    done('etat');
  }, fail);
}

// ---------- Rendu ----------
const TABS = {
  ip: [['ecoles', 'Écoles', 'school'], ['suivi', 'Suivi', 'chart'], ['membres', 'Membres', 'users'], ['ressources', 'Ressources', 'book']],
  mentor: [['fiche', 'Ma fiche', 'card'], ['demandes', 'Demandes', 'inbox'], ['ressources', 'Ressources', 'book']],
  nouveau: [['decouvrir', 'Découvrir', 'compass'], ['reseau', 'Mon réseau', 'users'], ['ressources', 'Ressources', 'book']],
};
const ROLE_LABEL = { ip: 'Insertion professionnelle', mentor: 'Mentor', nouveau: 'Nouveau prof' };

function render() {
  if (S.dragging) { S.pending = true; return; }
  const main = $('Main');
  renderHeader();
  if (S.phase === 'loading') { $('Tabs').hidden = true; main.className = ''; main.innerHTML = `<div class="empty"><p>Chargement de la salle des profs…</p></div>`; return; }
  if (S.phase === 'offline') {
    $('Tabs').hidden = true; main.className = '';
    main.innerHTML = `<div class="empty"><h3>Connecte-toi pour entrer</h3><p>Ouvre ce lien dans claude.ai en étant connecté à ton compte. Les fiches des collègues et les ressources apparaîtront ici.</p></div>`;
    return;
  }
  const v = view();
  if (!v || ((v === 'mentor' || v === 'nouveau') && (!me() || me().role !== v))) { $('Tabs').hidden = true; main.className = ''; main.innerHTML = renderWelcome(v); return; }
  if (v === 'nouveau') { $('Tabs').hidden = true; S.tab = 'decouvrir'; renderDeck(); return renderOverlay(); }
  const tabs = TABS[v];
  if (!tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];
  renderTabs(v, tabs);
  if (S.tab === 'decouvrir') return renderDeck();
  main.className = ''; main.dataset.sig = '';
  const html = {
    ecoles: renderEcoles, suivi: renderSuivi, membres: renderMembres, ressources: renderRessources,
    fiche: renderFiche, demandes: renderDemandes, reseau: renderReseau,
  }[S.tab]();
  main.innerHTML = html;
}

function renderHeader() {
  const v = S.phase === 'ready' ? view() : null;
  const m = me();
  const parts = [];
  if (v) parts.push(ROLE_LABEL[v]);
  if (m && v !== 'ip') parts.push(ecoleNom(m.ecoleId));
  if (v === 'ip') parts.push(`${S.ecoles.length} école${S.ecoles.length > 1 ? 's' : ''}`);
  const deckReady = S.phase === 'ready' && v === 'nouveau' && m && m.role === 'nouveau';
  $('Title').textContent = deckReady && m.nom ? `Salut ${first(m.nom)}! 👋` : 'Salle des profs';
  if (deckReady) {
    const { items } = deckItems();
    const np = items.filter(i => i.kind === 'prof').length, nr = items.length - np;
    $('Sub').textContent = (S.readonly ? 'Mode consultation · ' : '') + (items.length
      ? `${np} collègue${np > 1 ? 's' : ''} · ${nr} ressource${nr > 1 ? 's' : ''} à découvrir` : 'Rien de nouveau ici');
  } else $('Sub').textContent = S.phase === 'ready'
    ? (S.readonly ? 'Mode consultation' : (m && v !== 'ip' ? `Salut ${first(m.nom)} · ` : '') + parts.join(' · '))
    : S.phase === 'offline' ? 'Non connecté' : 'Chargement…';
  let extra = '';
  if (deckReady) {
    const net = Object.keys(S.demandes[S.uid] || {}).filter(id => S.membres[id]).length + S.etat.gardees.length;
    if (!S.readonly) extra += `<button class="icon-btn" data-act="ressource" title="Partager une ressource" aria-label="Partager une ressource">${ico('plus', 16)}</button>
      <button class="icon-btn" data-act="profil" title="Mon profil" aria-label="Mon profil">${ico('user', 16)}</button>`;
    extra += `<button class="net-pill" data-act="overlay" data-id="reseau" title="Mon réseau" aria-label="Mon réseau, ${net}">${ico('users', 16)}<span>${net}</span></button>`;
    const he = $('HeadExtra');
    if (he.dataset.html !== extra) { he.innerHTML = extra; he.dataset.html = extra; }
    return;
  }
  if (S.phase === 'ready' && S.isIP && !SEULEMENT_NOUVEAU) {
    extra += `<select class="viewas" id="ViewAs" aria-label="Voir l'application comme">
      <option value="ip"${v === 'ip' ? ' selected' : ''}>Vue IP</option>
      <option value="mentor"${v === 'mentor' ? ' selected' : ''}>Voir comme mentor</option>
      <option value="nouveau"${v === 'nouveau' ? ' selected' : ''}>Voir comme nouveau</option></select>`;
  }
  if (S.phase === 'ready' && m && v !== 'ip' && !S.readonly) extra += `<button class="icon-btn" data-act="profil" title="Mon profil" aria-label="Mon profil">${ico('user')}</button>`;
  const he = $('HeadExtra');
  if (he.dataset.html !== extra) { he.innerHTML = extra; he.dataset.html = extra; }
}

function renderTabs(v, tabs) {
  const nav = $('Tabs'); nav.hidden = false;
  const badges = {
    demandes: v === 'mentor' ? demandesRecues(S.uid).filter(d => d.statut === 'attente').length : 0,
    reseau: v === 'nouveau' ? Object.keys(S.demandes[S.uid] || {}).filter(id => statut(S.uid, id) === 'accepte' && S.membres[id]).length : 0,
  };
  nav.innerHTML = tabs.map(([k, label, i]) => `<button data-act="tab" data-tab="${k}"${S.tab === k ? ' aria-current="page"' : ''}>
    ${ico(i, 22)}<span>${label}</span>${badges[k] ? `<span class="badge">${badges[k]}</span>` : ''}</button>`).join('');
}

function renderWelcome(v) {
  if (!S.ecoles.length) {
    return S.isIP
      ? `<div class="empty"><h3>Crée d'abord une école</h3><p>Les profs choisiront leur école en s'inscrivant. Reviens à la vue IP pour en ajouter une.</p></div>`
      : `<div class="empty"><h3>Bienvenue!</h3><p>L'équipe d'insertion professionnelle n'a pas encore créé ton école. Reviens dans quelques jours.</p></div>`;
  }
  return `<div class="empty" style="padding-top:20px">
    <h3>Bienvenue dans la salle des profs</h3>
    <p>${SEULEMENT_NOUVEAU ? "Découvre les collègues prêts à t'aider et les ressources de ton école. Glisse à droite pour proposer un café." : "Les nouveaux profs découvrent les mentors et les ressources de leur école. Les profs d'expérience y affichent l'aide qu'ils offrent."}</p>
    <button class="btn" data-act="profil" data-role="${v || ''}">Créer mon profil</button></div>`;
}

// ----- IP : écoles -----
function renderEcoles() {
  const rows = S.ecoles.map(e => {
    const ms = mentors().filter(m => m.ecoleId === e.id).length;
    const ns = nouveaux().filter(m => m.ecoleId === e.id);
    const jum = ns.filter(n => Object.keys(S.demandes[n.uid] || {}).some(id => statut(n.uid, id) === 'accepte')).length;
    return `<div class="item">
      <div class="res-ico">${ico('school', 22)}</div>
      <div class="grow"><p class="title">${esc(e.nom)}</p>
        <p class="small muted">${ms} mentor${ms > 1 ? 's' : ''} · ${ns.length} nouveau${ns.length > 1 ? 'x' : ''} · ${jum} jumelé${jum > 1 ? 's' : ''}</p></div>
      <button class="icon-btn" data-act="ecole" data-id="${esc(e.id)}" title="Modifier" aria-label="Modifier ${esc(e.nom)}">${ico('edit', 18)}</button>
    </div>`;
  }).join('');
  return `<div class="stack">
    <div class="section-head"><h2>Écoles</h2><button class="btn sm" data-act="ecole">${ico('plus', 16)} Ajouter</button></div>
    ${rows || `<div class="empty"><h3>Aucune école pour l'instant</h3><p>Ajoute les écoles de ton centre de services. Les profs choisiront la leur en créant leur profil.</p></div>`}
    <p class="small muted">Pour qu'un prof puisse créer sa fiche, partage cette page avec lui avec l'accès Contributeur.</p>
    ${exampleIds().length ? `<div class="item"><div class="grow"><p class="title">Données d'exemple</p>
      <p class="small muted">${exampleIds().length} fiches de démonstration. Retire-les avant d'inviter les profs.</p></div>
      <button class="btn sm ghost" data-act="del-exemples">${ico('trash', 14)} Retirer</button></div>` : ''}
  </div>`;
}

// Les fiches de démonstration ont toutes un identifiant qui commence par « ex- ».
function exampleIds() {
  const ex = id => String(id).startsWith('ex-');
  return [
    ...S.ecoles.filter(e => ex(e.id)).map(e => 'ecoles/' + e.id),
    ...['membres', 'ressources', 'demandes', 'reponses'].flatMap(c => Object.keys(S[c]).filter(ex).map(id => c + '/' + id)),
  ];
}

// ----- IP : suivi des jumelages -----
function renderSuivi() {
  if (!S.ecoles.length) return `<div class="empty"><h3>Rien à suivre encore</h3><p>Crée une école, puis invite les profs.</p></div>`;
  const ecole = S.suiviEcole && S.ecoles.some(e => e.id === S.suiviEcole) ? S.suiviEcole : 'all';
  const inE = m => ecole === 'all' || m.ecoleId === ecole;
  const ns = nouveaux().filter(inE).map(n => {
    const ids = Object.keys(S.demandes[n.uid] || {}).filter(id => S.membres[id]);
    const st = ids.map(id => statut(n.uid, id));
    const etat = st.includes('accepte') ? 'jumele' : st.includes('attente') ? 'attente' : 'seul';
    return { ...n, etat, nb: ids.length };
  }).sort((a, b) => ({ seul: 0, attente: 1, jumele: 2 })[a.etat] - ({ seul: 0, attente: 1, jumele: 2 })[b.etat] || (a.creeLe || 0) - (b.creeLe || 0));
  const ms = mentors().filter(inE);
  const pending = ms.reduce((t, m) => t + demandesRecues(m.uid).filter(d => d.statut === 'attente').length, 0);
  const seuls = ns.filter(n => n.etat === 'seul').length;
  const dispo = ms.filter(m => m.mentorat && mentoratsActifs(m.uid) < (m.places || 0)).length;
  const lab = { seul: '<span class="pill danger">Sans contact</span>', attente: '<span class="pill warn">En attente</span>', jumele: '<span class="pill ok">Jumelé</span>' };
  return `<div class="stack">
    <div class="chips">${[['all', 'Toutes les écoles'], ...S.ecoles.map(e => [e.id, e.nom])].map(([k, l]) =>
      `<button class="chip" data-act="suivi-ecole" data-id="${esc(k)}" aria-pressed="${k === ecole}">${esc(l)}</button>`).join('')}</div>
    <div class="tiles">
      <div class="tile${seuls ? ' alert' : ''}"><b>${seuls}</b><span>nouveaux sans contact</span></div>
      <div class="tile"><b>${pending}</b><span>demandes en attente</span></div>
      <div class="tile"><b>${dispo}</b><span>mentors avec une place</span></div>
    </div>
    <div class="section-head"><h2>Nouveaux profs</h2><span class="small muted">${ns.length}</span></div>
    ${ns.map(n => {
      const d = daysAgo(n.creeLe);
      return `<div class="item">${avatar(n.uid, n.nom, n.photo)}<div class="grow">

// ----- Nouveau : paquet de cartes -----
function deckItems() {
  const m = me();
  const vers = S.demandes[S.uid] || {};
  const passes = new Set(S.etat.passes), kept = new Set(S.etat.gardees.map(g => g.k));
  const f = S.filter;
  const okF = it => f === 'all' || (f === 'prof' && it.kind === 'prof') || (f === 'mentorat' && it.kind === 'prof' && it.mentorat)
    || (f === 'res' && it.kind === 'res') || (f.startsWith('g:') && it.matiere === f.slice(2));
  const score = it => (it.matiere === m.matiere ? 2 : 0) + (it.niveau === m.niveau ? 1 : 0) + (it.mentorat ? 1 : 0);
  const realMentors = mentors().filter(x => x.uid !== S.uid);
  let profs = realMentors.filter(x => S.scope === 'all' || x.ecoleId === m.ecoleId)
    .map(x => ({ kind: 'prof', key: 'm:' + x.uid, ...x }))
    .filter(x => !vers[x.uid] && !passes.has(x.key));
  let res = allResources().filter(r => r.auteur !== S.uid && !kept.has(r.key) && !passes.has(r.key));
  const exemples = !realMentors.length && !allResources().length;
  if (exemples) { profs = EXEMPLES.filter(e => e.kind === 'prof' && !passes.has(e.key)); res = EXEMPLES.filter(e => e.kind === 'res' && !passes.has(e.key)); }
  profs = profs.filter(okF).sort((a, b) => score(b) - score(a));
  res = res.filter(okF).sort((a, b) => score(b) - score(a));
  const out = []; let r = 0;
  profs.forEach((p, i) => { out.push(p); if (i % 2 === 1 && r < res.length) out.push(res[r++]); });
  return { items: out.concat(res.slice(r)), exemples };
}

function attachDrag(card, it) {
  let sx = 0, sy = 0, dx = 0, dy = 0, on = false;
  const st = n => card.querySelector('.stamp.' + n);
  const show = (l, n, s) => { st('like').style.opacity = l; st('nope').style.opacity = n; st('super').style.opacity = s; };
  card.addEventListener('pointerdown', e => { on = true; S.dragging = true; card.setPointerCapture(e.pointerId); card.classList.remove('animating'); sx = e.clientX; sy = e.clientY; dx = dy = 0; });
  card.addEventListener('pointermove', e => {
    if (!on) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    card.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx * .06}deg)`;
    if (dx > 20) show(Math.min(dx / 110, 1), 0, 0); else if (dx < -20) show(0, Math.min(-dx / 110, 1), 0);
    else if (dy < -40) show(0, 0, Math.min(-dy / 110, 1)); else show(0, 0, 0);
  });
  const end = () => {
    if (!on) return;
    on = false; card.classList.add('animating');
    const dir = dx > 100 ? 'like' : dx < -100 ? 'nope' : (dy < -120 && Math.abs(dx) < 80) ? 'super' : null;
    if (dir) return swipe(dir, card, it);
    card.style.transform = ''; show(0, 0, 0); S.dragging = false;
    if (S.pending) { S.pending = false; render(); }
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

function swipe(dir, card, it) {
  card.style.pointerEvents = 'none'; card.classList.add('animating');
  card.querySelector('.stamp.' + dir).style.opacity = 1;
  card.style.transform = dir === 'like' ? `translate(${innerWidth}px, 40px) rotate(28deg)`
    : dir === 'super' ? `translate(0, -${innerHeight}px) scale(.9)` : `translate(-${innerWidth}px, 40px) rotate(-28deg)`;
  S.dragging = true;
  setTimeout(() => { S.dragging = false; S.pending = false; act(dir, it); }, 260);
}

function saveEtat() { return write(`data/users/${S.uid}/etat`, { passes: S.etat.passes.slice(-400), gardees: S.etat.gardees }); }
function saveDemandes() { if (S.readonly) S.localVers = S.demandes[S.uid] || {}; return write(`demandes/${S.uid}`, { vers: S.demandes[S.uid] || {} }); }

function act(dir, it) {
  if (dir === 'nope') {
    S.etat.passes.push(it.key); saveEtat();
    S.history.push({ t: 'pass', key: it.key });
  } else if (it.exemple) {
    S.etat.passes.push(it.key); saveEtat();
    S.history.push({ t: 'pass', key: it.key });
    toast("C'est une carte d'exemple. Les vrais mentors apparaîtront quand ils auront créé leur fiche.");
  } else if (it.kind === 'res') {
    S.etat.gardees.push({ k: it.key, star: dir === 'super' }); saveEtat();
    S.history.push({ t: 'garde', key: it.key });
    toast(dir === 'super' ? 'Ressource marquée essentielle' : 'Ressource gardée dans Mon réseau');
  } else {
    const type = dir === 'super' ? 'mentorat' : 'cafe';
    if (type === 'mentorat' && !it.mentorat) {
      toast(`${first(it.nom)} n'offre pas de mentorat. Invitation café envoyée.`);
    }
    const realType = type === 'mentorat' && it.mentorat ? 'mentorat' : 'cafe';
    S.demandes[S.uid] = { ...(S.demandes[S.uid] || {}), [it.uid]: { type: realType, le: Date.now() } };
    saveDemandes();
    S.history.push({ t: 'demande', uid: it.uid });
    if (statut(S.uid, it.uid) === 'accepte') showMatch(it, realType);
    else if (!(type === 'mentorat' && !it.mentorat)) toast(`Demande envoyée à ${first(it.nom)}. Tu verras sa réponse dans Mon réseau.`);
  }
  render();
}

function undo() {
  const h = S.history.pop();
  if (!h) return;
  if (h.t === 'pass') { S.etat.passes = S.etat.passes.filter(k => k !== h.key); saveEtat(); }
  if (h.t === 'garde') { S.etat.gardees = S.etat.gardees.filter(g => g.k !== h.key); saveEtat(); }
  if (h.t === 'demande') { const v = { ...(S.demandes[S.uid] || {}) }; delete v[h.uid]; S.demandes[S.uid] = v; saveDemandes(); }
  toast('Dernier choix annulé');
  render();
}

function showMatch(m, type) {
  const mine = me();
  openSheet(`<div class="match-hero">
    <p class="label">${type === 'mentorat' ? 'Mentorat accepté' : 'Nouvelle connexion'}</p>
    <h2>C'est un match! 🎉</h2>
    <div class="pair">${avatar(S.uid, mine.nom || 'Toi', mine.photo)}${ico('handshake', 30)}${avatar(m.uid, m.nom, m.photo)}</div>
    <p>${esc(first(m.nom))} accepte les ${type === 'mentorat' ? 'demandes de mentorat' : 'invitations café'}. Écris-lui pour fixer un moment.</p>
    <div style="width:100%;text-align:left">${contactHtml(m)}</div>
    <button class="btn" style="width:100%" data-act="close">Continuer à découvrir</button></div>`);
}

}
function closeSheet() { $('SheetRoot').innerHTML = ''; sheetSubmit = null; }
const sheetOpen = () => !!$('SheetRoot').firstElementChild;
const head = t => `<div class="sheet-head"><h2>${t}</h2><button type="button" class="icon-btn" data-act="close" aria-label="Fermer">${ico('x', 18)}</button></div>`;

function confirmSheet(title, text, label, fn) {

      </div>
      <label class="field"><span>Quand me trouver</span><input id="FDispo" name="dispo" maxlength="60" value="${v('dispo')}" placeholder="Dîner mardi et jeudi"></label>
      <label class="field"><span>Je peux t'aider avec</span><textarea id="FAide" name="aideAvec" rows="2" maxlength="220" placeholder="Planifier ta première étape, corriger plus vite…">${v('aideAvec')}</textarea></label>
      <label class="field"><span>Mots-clés</span><input id="FTags" name="tags" maxlength="120" value="${esc((m.tags || []).join(', '))}" placeholder="Lecture, Évaluation, Plein air"><small>Sépare-les par des virgules.</small></label>
      <label class="check"><input type="checkbox" id="FMentorat" name="mentorat"${m.mentorat ? ' checked' : ''}><span><b>J'offre du mentorat</b><br><span class="small muted">Un accompagnement suivi pendant l'année, en plus des cafés.</span></span></label>
      <label class="field"><span>Places de mentorat</span><input id="FPlaces" name="places" type="number" min="0" max="6" value="${esc(m.places ?? 1)}"></label>
      <label class="check"><input type="checkbox" id="FAuto" name="autoAccept"${m.autoAccept ? ' checked' : ''}><span><b>Accepter automatiquement</b><br><span class="small muted">Le nouveau prof voit tout de suite tes coordonnées, sans attendre ta réponse.</span></span></label>
    </div>
    <p class="small" id="FErr" style="color:var(--danger)" hidden></p>

  const sync = () => {
    const r = $('ProfilForm').querySelector('[name=role]:checked, input[type=hidden][name=role]').value;
    $('ProfilForm').querySelectorAll('[data-for]').forEach(el => el.hidden = el.dataset.for !== r);
  };
  $('ProfilForm').addEventListener('change', sync); sync();

  $('FPaste').addEventListener('paste', e => {
    const items = [...(e.clipboardData?.items || [])];
    const f = items.find(i => i.kind === 'file' && i.type.startsWith('image/'))?.getAsFile() || e.clipboardData?.files?.[0];
    e.preventDefault(); e.target.value = '';
    if (f) useFile(f); else { const er = $('FErr'); er.textContent = "Le presse-papiers ne contient pas d'image. Copie d'abord une photo."; er.hidden = false; }
  });
  $('FPhotoDel').addEventListener('click', () => { pendingPhoto = ''; preview(''); });
}

// Recadre au format de la carte (4:5) et compresse en JPEG pour tenir dans la fiche.
let pendingPhoto;
async function shrinkPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const W = 480, H = 600, r = Math.max(W / img.naturalWidth, H / img.naturalHeight);
    const w = img.naturalWidth * r, h = img.naturalHeight * r;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    c.getContext('2d').drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
    for (const q of [.78, .65, .5, .4]) { const d = c.toDataURL('image/jpeg', q); if (d.length < 180000) return d; }
    throw new Error('trop lourde');
  } finally { URL.revokeObjectURL(url); }
}

function saveProfil(form) {
  const fd = new FormData(form);
  const g = k => String(fd.get(k) || '').trim();
  const nom = g('nom');
  const err = t => { const e = $('FErr'); e.textContent = t; e.hidden = false; };
  if (!nom) return err('Écris ton prénom et ton nom pour que les collègues te reconnaissent.');
  if (!g('ecoleId')) return err('Choisis ton école pour voir les collègues qui y travaillent.');
  const role = g('role');
  const prev = me() || {};
  const photo = pendingPhoto !== undefined ? pendingPhoto : (okPhoto(prev.photo) ? prev.photo : '');
  const data = { role, nom, photo, ecoleId: g('ecoleId'), matiere: g('matiere'), niveau: g('niveau'), fonction: g('fonction'), courriel: g('courriel'),
    creeLe: prev.creeLe || Date.now(), majLe: Date.now() };
  if (role === 'mentor') Object.assign(data, {
    local: g('local'), annees: Math.max(0, Math.min(50, parseInt(g('annees')) || 0)), dispo: g('dispo'), aideAvec: g('aideAvec'),
    tags: g('tags').split(',').map(t => t.trim()).filter(Boolean).slice(0, 6), mentorat: fd.get('mentorat') === 'on',
    places: Math.max(0, Math.min(6, parseInt(g('places')) || 0)), autoAccept: fd.get('autoAccept') === 'on' });
  else data.besoins = g('besoins');
  S.membres[S.uid] = data;
  write(`membres/${S.uid}`, data).then(() => toast('Profil enregistré'));
  closeSheet(); render();
}

function ecoleSheet(id) {
  const e = S.ecoles.find(x => x.id === id) || {};
  openSheet(`<form id="EcoleForm" class="stack" novalidate>${head(id ? 'Modifier l’école' : 'Nouvelle école')}
    <label class="field"><span>Nom de l'école</span><input id="ENom" name="nom" required maxlength="80" value="${esc(e.nom || '')}" placeholder="École secondaire des Patriotes"></label>
    <p class="small" id="EErr" style="color:var(--danger)" hidden></p>
    <div class="row" style="justify-content:space-between">
      ${id ? `<button type="button" class="btn danger" data-act="del-ecole" data-id="${esc(id)}">${ico('trash', 16)} Supprimer</button>` : '<span></span>'}
      <button class="btn" type="submit">Enregistrer</button></div></form>`, form => {
    const nom = String(new FormData(form).get('nom') || '').trim();
    if (!nom) { const er = $('EErr'); er.textContent = "Donne un nom à l'école."; er.hidden = false; return; }
    const docId = id || 'e' + uidShort();
    write(`ecoles/${docId}`, { nom, creeLe: e.creeLe || Date.now() })
      .then(() => toast(id ? 'École modifiée' : 'École ajoutée'));
    closeSheet();
  });
}

function ressourceSheet(id) {
  const mine = S.ressources[S.uid] || [];
  const r = mine.find(x => x.id === id) || {};
  openSheet(`<form id="ResForm" class="stack" novalidate>${head(id ? 'Modifier la ressource' : 'Partager une ressource')}
    <label class="field"><span>Titre</span><input id="RTitre" name="titre" required maxlength="80" value="${esc(r.titre || '')}" placeholder="Ma grille de correction en écriture"></label>
    <div class="grid2">
      <label class="field"><span>Type</span><select id="RType" name="type">${options(RTYPES, r.type)}</select></label>
      <label class="field"><span>Matière</span><select id="RMatiere" name="matiere">${options(GROUPS, r.matiere || me()?.matiere)}</select></label>
    </div>
    <label class="field"><span>Lien (facultatif)</span><input id="RLien" name="lien" type="url" maxlength="300" value="${esc(r.lien || '')}" placeholder="https://drive.google.com/…"></label>
    <label class="field"><span>Pourquoi c'est utile</span><textarea id="RDesc" name="desc" rows="3" maxlength="300" placeholder="M'a sauvé la vie en septembre…">${esc(r.desc || '')}</textarea></label>
    <label class="field"><span>Signature</span><input id="RSig" name="signature" maxlength="60" value="${esc(r.signature || me()?.nom || '')}" placeholder="Équipe d'insertion"></label>
    <p class="small" id="RErr" style="color:var(--danger)" hidden></p>
    <button class="btn" type="submit">${id ? 'Enregistrer' : 'Partager'}</button></form>`, form => {
    const fd = new FormData(form); const g = k => String(fd.get(k) || '').trim();
    const err = $('RErr');
    if (!g('titre')) { err.textContent = 'Donne un titre à la ressource.'; err.hidden = false; return; }
    if (g('lien') && !safeUrl(g('lien'))) { err.textContent = 'Le lien doit commencer par https://'; err.hidden = false; return; }
    const item = { id: id || uidShort(), titre: g('titre'), type: g('type'), matiere: g('matiere'), lien: g('lien'), desc: g('desc'),
      signature: g('signature'), creeLe: r.creeLe || Date.now() };
    const items = id ? mine.map(x => x.id === id ? item : x) : [item, ...mine];
    S.ressources[S.uid] = items;
    write(`ressources/${S.uid}`, { items }).then(() => toast(id ? 'Ressource modifiée' : 'Ressource partagée'));
    closeSheet(); render();
  });
}

// ---------- Actions ----------
const ACTIONS = {
  tab: d => { S.tab = d.tab; render(); $('Main').scrollTop = 0; },
  overlay: d => { S.overlay = d.id || null; render(); },
  profil: d => profilSheet(d.role),
  close: () => closeSheet(),
  backdrop: (d, el, e) => { if (e.target === el) closeSheet(); },
  confirm: () => { const f = sheetSubmit; closeSheet(); f && f(); },
  filter: d => { S.filter = d.id; render(); },
  scope: () => { S.scope = S.scope === 'ecole' ? 'all' : 'ecole'; render(); },
  'res-filter': d => { S.resFilter = d.id; render(); },
  'suivi-ecole': d => { S.suiviEcole = d.id; render(); },
  swipe: d => {
    const top = $('Stack')?.lastElementChild;
    const it = deckItems().items[0];
    if (!top || !it || !top.classList.contains('card')) return;
    swipe(d.dir, top, it);
  },
  undo: () => undo(),
  reset: () => { S.etat.passes = []; S.history = []; saveEtat(); render(); toast('Les cartes passées sont revenues'); },
  ecole: d => ecoleSheet(d.id),
  'del-ecole': d => {
    const e = S.ecoles.find(x => x.id === d.id);
    const n = Object.values(S.membres).filter(m => m.ecoleId === d.id).length;
    confirmSheet(`Supprimer ${e?.nom || 'cette école'}?`, n ? `${n} membre${n > 1 ? 's' : ''} y sont inscrits. Leur fiche restera, mais sans école.` : "Personne n'y est inscrit.", 'Supprimer',
      () => remove(`ecoles/${d.id}`).then(() => toast('École supprimée')));
  },
  'del-membre': d => {
    const m = S.membres[d.id];
    confirmSheet(`Retirer ${m?.nom || 'ce membre'}?`, 'Sa fiche disparaîtra du paquet et du suivi. La personne pourra en créer une nouvelle.', 'Retirer',
      () => remove(`membres/${d.id}`).then(() => toast('Fiche retirée')));
  },
  ressource: d => ressourceSheet(d.id),
  'del-exemples': () => {
    const ids = exampleIds();
    confirmSheet('Retirer les données d’exemple?', `${ids.length} fiches de démonstration seront supprimées pour tout le monde. Les vraies fiches restent.`, 'Retirer',
      () => Promise.all(ids.map(remove)).then(() => toast('Données d’exemple retirées')));
  },
  'del-ressource': d => {
    const [, auteur, id] = d.key.split(':');
    const items = (S.ressources[auteur] || []).filter(x => x.id !== id);
    confirmSheet('Supprimer cette ressource?', 'Elle disparaîtra pour tout le monde.', 'Supprimer', () => {
      S.ressources[auteur] = items;
      write(`ressources/${auteur}`, { items }).then(() => toast('Ressource supprimée')); render();
    });
  },
  garder: d => {
    const has = S.etat.gardees.some(g => g.k === d.key);
    S.etat.gardees = has ? S.etat.gardees.filter(g => g.k !== d.key) : [...S.etat.gardees, { k: d.key, star: false }];
    saveEtat(); render(); toast(has ? 'Retirée de Mon réseau' : 'Gardée dans Mon réseau');
  },
  repondre: d => {
    S.reponses[S.uid] = { ...(S.reponses[S.uid] || {}), [d.id]: d.r };
    write(`reponses/${S.uid}`, { de: S.reponses[S.uid] }).then(() => toast(d.r === 'accepte' ? 'Jumelage confirmé' : 'Réponse envoyée'));
    render();
  },
  annuler: d => { const v = { ...(S.demandes[S.uid] || {}) }; delete v[d.id]; S.demandes[S.uid] = v; saveDemandes(); render(); toast('Demande annulée'); },
};

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && ACTIONS[a.dataset.act]) ACTIONS[a.dataset.act](a.dataset, a, e);
});
document.addEventListener('submit', e => { e.preventDefault(); if (sheetSubmit) sheetSubmit(e.target); });
document.addEventListener('change', e => {
  if (e.target.id === 'ViewAs') { S.view = e.target.value === 'ip' ? null : e.target.value; S.tab = null; render(); }
});
addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetOpen()) return closeSheet();
  if (e.key === 'Escape' && S.overlay) { S.overlay = null; return render(); }
  if (sheetOpen() || S.overlay || S.tab !== 'decouvrir' || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) return;
  const dir = { ArrowLeft: 'nope', ArrowRight: 'like', ArrowUp: 'super' }[e.key];
  if (dir) { e.preventDefault(); ACTIONS.swipe({ dir }); }
  if (e.key === 'Backspace') undo();
});

boot();
</script>
